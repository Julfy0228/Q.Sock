services:
  messenger:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Bootstrap__AdminUser: ${QSOCK_ADMIN_USER:?Set QSOCK_ADMIN_USER}
      Bootstrap__AdminPassword: ${QSOCK_ADMIN_PASSWORD:?Set QSOCK_ADMIN_PASSWORD}
      Server__Name: ${QSOCK_SERVER_NAME:-Q.Sock}
    volumes:
      - database:/app/data
      - keys:/app/state
      - files:/app/storage

volumes:
  database:
  keys:
  files:
