<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Q.Sock — Avalonia</title>
    <style>
      html, body, #out { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171a22; }
      .loading { display: grid; place-items: center; height: 100%; color: #eceef5; font: 16px system-ui; }
      .call-media {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        grid-auto-rows: max-content;
        gap: 16px;
        align-content: start;
        width: 100%;
        height: 100%;
        padding: 8px;
        box-sizing: border-box;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--call-muted, #949ba4) var(--call-background, #313338);
        background: var(--call-background, #313338);
      }
      .call-tile {
        position: relative;
        display: flex;
        min-height: 160px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 12px;
        background: var(--call-panel, #2b2d31);
      }
      .call-tile-label {
        position: absolute;
        bottom: 10px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--call-background, #313338);
        color: var(--call-text, #f2f3f5);
        font: 12px Inter, system-ui;
      }
    </style>
  </head>
  <body>
    <div id="out"><div class="loading">Загрузка Q.Sock…</div></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
